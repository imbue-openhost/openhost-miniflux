[app]
name = "miniflux"
version = "0.3.0"
description = "Miniflux minimalist RSS reader with built-in PostgreSQL and Cloud in a Bottle SSO"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/healthcheck"
# /healthcheck is exposed unauthenticated so the OpenHost router can probe
# liveness. /js/ is public so the browser can register the Miniflux service
# worker without hitting the OpenHost auth redirect (browsers reject service
# worker scripts served behind a redirect). All other paths go through the
# container's auth-proxy sidecar which enforces the zone_auth cookie before
# forwarding to Miniflux.
public_paths = ["/healthcheck", "/js/"]

[resources]
memory_mb = 512
cpu_cores = 0.25

[data]
app_data = true
